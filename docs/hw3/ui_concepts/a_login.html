<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>RoomBook · Регистрация (концепт A)</title>
<style>:root{--bg:#16171d;--text:#9ca3af;--text-h:#f3f4f6;--border:#2e303a;--accent:#c084fc;--err:#f87171}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh}
.card{width:380px;border:1px solid var(--border);border-radius:12px;padding:28px;box-shadow:0 10px 15px -3px rgba(0,0,0,.4)}
.logo{font-weight:700;color:var(--text-h);margin-bottom:6px}.logo i{color:var(--accent);font-style:normal}h1{margin:0 0 18px;font-size:26px;font-weight:500;color:var(--text-h)}
.f{margin-bottom:14px;font-size:14px}.in{margin-top:6px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text-h);font-size:15px;background:#1c1d25}.bad .in{border-color:var(--err)}.err{color:var(--err);font-size:13px;margin-top:5px}
.btn{background:var(--accent);color:#16171d;border-radius:8px;padding:11px;text-align:center;font-weight:600;margin-top:6px}.alt{text-align:center;font-size:14px;margin-top:14px}.alt b{color:var(--accent);font-weight:500}</style></head><body>
<div class="card"><div class="logo">Room<i>Book</i></div><h1>Регистрация</h1>
<div class="f bad"><label>E-mail</label><div class="in">alexey.example.com</div><div class="err">Введите адрес в формате name@example.com</div></div>
<div class="f bad"><label>Пароль</label><div class="in">•••••••</div><div class="err">Пароль должен содержать не менее 8 символов</div></div>
<div class="btn">Создать аккаунт</div><div class="alt">Уже есть аккаунт? <b>Войти</b></div></div></body></html>
